# core/placement.yaml — single source of truth for where code lives.
# Tested by __tests__/phase-e-foundation/placement-manifest.test.js.
# New files MUST be added here; tests fail until they are.
# Paths are relative to core/. Role taxonomy: see docs/placement.md §2.

files:
  # === facade ===
  - path: gate-decision-log.js
    role: facade
    summary: Appends structured decision rows to .gate-decision.log.
  - path: gate-logging.js
    role: facade
    summary: Rotates + appends gate-log.jsonl (appendGateLog / logToolCall) — the canonical I/O helper re-exported by tools/lib for the shell-side handlers.
  - path: pattern-config.js
    role: facade
    summary: Single load of patterns.json + derived gate config (message_flags, inert-sinks, gate-verbs, constraint/gate-verb regex maps) shared by blanking.js and gate-logic.js.
  - path: gate-logic.js
    role: facade
    summary: Gate decision library — globMatch, applyPromotedRules, writePreflightMarker.
  - path: evidence-ref.js
    role: primitive
    summary: Shared evidence-code reference suffix normalization for Rule and finding grounding.
  - path: rule-index.js
    role: facade
    summary: Compiles the canonical active Rule registry into validated I2/I3 projections with I3 evidence grounding diagnostics.
  - path: gate-override.js
    role: facade
    summary: Reads/validates .gate-override markers with TTL expiry.
  - path: hint-registry.js
    role: facade
    summary: Single source of truth for context-injection hints (slug-keyed entries).
  - path: hint-renderer.js
    role: facade
    summary: Budget-aware channel-based projection of the hint registry.
  - path: inbound-state.js
    role: facade
    summary: Reads runtime-state.jsonl sidecar for inbound gate context.
  - path: observation-staleness.js
    role: facade
    summary: Shared observation-staleness primitives (OBSERVATION_STALENESS_WINDOW_MS + reference-time model + age/marker mode-predicates, stale-on-null). Replaces the two parallel 30-min checks across the inbound + bash gates.
  - path: loop-introspect.js
    role: facade
    summary: Builds inverse indexes + query helpers over the meta-state registry.
  - path: manifest-loader.js
    role: facade
    summary: Single source of truth for resolving canonical manifest entries to the actual handler files under tools/handlers/ (resolveToolFile + resolveToolImportUrl).
  - path: meta-state.js
    role: facade
    summary: Registry CRUD + Zod schemas for the 4-kind meta-state union.
  - path: registry-lock.js
    role: facade
    summary: Cross-process file lock (proper-lockfile wrapper) for the meta-state registry.
  - path: worktree-version.js
    role: facade
    summary: Per-worktree .loop-version declaration + schema-version-skew detection.
  - path: worktree-session-id.js
    role: facade
    summary: Per-worktree session ID for marker file isolation (Multi-Session Isolation gap).
  - path: runtime-state.js
    role: facade
    summary: Shared runtime-state.jsonl helpers (append + fingerprint) shared by runtime_state_record and meta_state_dispatch_finding.
  - path: runtime-tracking.js
    role: facade
    summary: Operator per-surface tracking toggle (load/isSurfacePaused/set) against the `.loop/runtime-tracking.json` sidecar. Fail-closed on malformed sidecars; read-from-disk per call (no in-process cache).

  # === verification ===
  - path: check-grounding.js
    role: verification
    summary: Computes SHA-256 fingerprints and compares to stored values.
  - path: consistency-check.js
    role: verification
    summary: Pure status/audit-field drift detector (no I/O).
  - path: derive-status.js
    role: verification
    summary: Derives effective status from stored refs + filesystem state.
  - path: stale-view.js
    role: verification
    summary: Derived evidence-freshness view (isOpen, isStaleView, derivedStaleSet) replacing persisted status:"stale".
  - path: query-drift.js
    role: verification
    summary: Aggregates drift events across the meta-state registry.
  - path: runtime-agnostic-checklist.js
    role: verification
    summary: 6-item runtime-agnostic pattern checklist for features.
  - path: verification-runner.js
    role: verification
    summary: Executes verification.steps with cmd-allowlist + timeout.

  # === primitive ===
  - path: envelope-stripper.js
    role: primitive
    summary: Strips MCP hookSpecificOutput envelopes from raw text.
  - path: field-glossary.js
    role: primitive
    summary: Single source of truth for meta-state field definitions; served via loop_describe cold tier and JIT error payloads.
  - path: schema-glossary.js
    role: primitive
    summary: Shared describeField helper pointing schema nodes at the field glossary (See field_glossary.<field>); entry-field semantics only, never filter/op-input params.
  - path: canonical-compare.js
    role: primitive
    summary: Sorted-keys + set-semantics canonical comparator for the no-op short-circuit (resolves meta-260715T2311Z-gratuitous-mutations).
  - path: registry-append-atomic.js
    role: primitive
    summary: trueAppendAtomic — O_APPEND + fsync'd writes + assertNoChangeLogLeak guard. Replaces the read-all → full-rewrite pattern (RT H1 + H4).
  - path: cli-tools.js
    role: primitive
    summary: Shared CLI read+write tool set; the CLI allowlist. MCP registers only the irreducible residue — this set never rides MCP.
  - path: cli-self-match.js
    role: primitive
    summary: canonicalCliInvocationShapes plus matchesCliTransport — the activation-branch guard for meta_state_promote_rule that rejects regex rules matching the CLI's own invocation shape.
  - path: cli-stderr.js
    role: facade
    summary: classifyCliError plus UsageError — splits non-usage errors into recognized-rejection JSON vs InternalError JSON for the CLI write-path stderr contract. Role is facade because it composes identity-pin, path-containment, and meta-state error classes into the stderr-classification policy.
  - path: cli-context-savings.js
    role: helper
    summary: Pure CLI delta computation — parseManifestJsonc, resolveWireBytesForCliTools (dynamic import + parity-view wire bytes), computeCliContextSavings. Composes schema-normalize + schema-parity + manifest-loader.
  - path: schema-normalize.js
    role: primitive
    summary: Transport-agnostic normalizeInputSchema — identity-or-wrap a handler's input schema so non-Mastra consumers (the read-only CLI) can reuse it without importing the MCP transport's deps.
  - path: schema-parity.js
    role: primitive
    summary: Build a JSON-Schema-parity view of a Zod schema (buildParitySchema) — unwraps z.preprocess / guarded-boolean unions so MCP/CLI wire schemas stay identical to the pre-migration shape. Pure zod transform; consumed by create-loop-tool/create-loop-workflow and cli-context-savings.
  - path: workflow-input-schema.js
    role: primitive
    summary: wrapWorkflowInputSchema — the U-Q1 unwrap contract for plain handler modules re-homed out of createLoopWorkflow; bakes z.preprocess(stripMcpContentEnvelope, normalizeInputSchema(schema)) into each unwrapped handler's schema so MCP-path envelope stripping survives the unwrap. Composes envelope-stripper + schema-normalize only (transport-agnostic).
  - path: registry-stats.js
    role: helper
    summary: computeRegistryStats + findDuplicateVersionPerId — shared helper consumed by loop_describe warm tier (no shell subprocess from MCP server) and the compaction signal.
  - path: file-readers.js
    role: facade
    summary: Composes runtime-state read + observation projection + assertinvariant wrapper for the bash-gate constraint consumer.
  - path: path-containment.js
    role: primitive
    summary: resolveSafePath — realpath containment + hardlink rejection for user-supplied paths.
  - path: identity-pin.js
    role: facade
    summary: Process-boot runtime identity pin (frozen, immutable for process lifetime).
  - path: r2/ownership.js
    role: evaluator
    summary: checkR2Ownership — per-runtime allowlist + BOOTSTRAP_DENY decision cascade.
  - path: r2/path-field-detector.js
    role: evaluator
    summary: detectPathFields + validateToolManifest — declared write-path args with default-deny.
  - path: r2/allowlist-cache.js
    role: cache
    summary: Loads and caches .loop/r2-allowlist.json per root; invalidateAllowlist on operator edit.
  - path: r2/allowlist-shape.js
    role: evaluator
    summary: validateR2AllowlistShape — pure schema validator for r2-allowlist/v1 before the atomic write.
  - path: r2/denial-log.js
    role: facade
    summary: Appends one JSON-serialized R2 denial line to the cross-surface decision log.
  - path: slugify.js
    role: primitive
    summary: Slugify strings for ids (lowercase, hyphens, alphanumeric).
  - path: strict-boolean-guard.js
    role: primitive
    summary: Coerces string/bool inputs to strict boolean.
  - path: surfaces.js
    role: primitive
    summary: SURFACES constant + read/write helpers for multi-surface dirs.
  - path: constants.js
    role: primitive
    summary: Shared core constants (STALENESS_WINDOW_MS) — single source of truth to prevent cross-module drift.
  - path: update-entry-helpers.js
    role: helper
    summary: Shared applyUpdateAndCheck — wraps updateEntry + version_mismatch/throw branch. Used by meta_state_re_verify and meta_state_supersede.
  - path: operation-envelope.js
    role: helper
    summary: Operation envelope construction (kind enum + content-hash + pre/post counts) and validation. Auto-emitted by meta_state_batch when callers pass an envelope; replaces ad-hoc `change_diff` arrays with a structural magnitude record.
  - path: operation-invariant.js
    role: helper
    summary: Universal pre-state-only assertinvariant boundary helper. Wraps every core-logic operation that owns an invariant the agent depends on; reduces 4 ad-hoc mechanisms + 1 deny-list to 2 layers (wrapper + kept IMMUTABLE_PATCH_FIELDS deny-list). Mixed behavior — pure pre-state check that emits a gate-log violation on failure.
  - path: stable-artifacts-lineage.js
    role: primitive
    summary: Shared plan-ID/phase-number lineage matcher (PATTERNS + durable-id masking + findLineageMatches) for the stable-artifacts rule; single source of truth consumed by the file-scan test and the commit-msg hook.

  # === evaluator ===
  - path: evaluate-write-gate.js
    role: evaluator
    summary: Write-gate evaluator — rule-registry cascade + preflight delegation.
  - path: evaluate-bash-gate.js
    role: evaluator
    summary: Bash-gate evaluator — constraint pattern + path-write + promoted-rules combination.
  - path: evaluate-inbound-gate.js
    role: evaluator
    summary: Inbound-gate evaluator — state-change signal + staleness check.

  # === cache ===
  - path: loop-introspect-cache.js
    role: cache
    summary: TTL cache wrapper around loop-introspect query results.
  - path: read-registry-cache.js
    role: cache
    summary: TTL cache wrapper around readRegistry calls.

  # === helper ===
  - path: entry/deep-freeze.js
    role: primitive
    summary: Recursive Object.freeze helper for nested Zod-parsed data.
  - path: entry/change-log.js
    role: helper
    summary: Factory wrapping metaStateChangeEntrySchema with relationship methods.
  - path: entry/index.js
    role: helper
    summary: factoryFor dispatcher + validateCrossRefs/findOrphans/outboundRefsAll graph API.
  - path: entry/finding.js
    role: helper
    summary: Factory wrapping metaStateFindingEntrySchema with relationship methods.
  - path: entry/relationship-graph.js
    role: helper
    summary: Single source of truth for the meta-state relationship model — CROSS_REFS table per kind, forward/inverse resolution, buildInverseIndexes (6-map shape), write-time structural RI (id-existence), diffChangedRefs. Folds parseConsolidates + inboundFromLoopDesign leaf helpers. Pure (no fs/gate-logic/stale-view/meta-state imports).
  - path: entry/loop-design.js
    role: helper
    summary: Factory wrapping metaStateLoopDesignSchema with relationship methods.
  - path: entry/rule.js
    role: helper
    summary: Factory wrapping metaStateRuleEntrySchema with relationship methods.
  - path: recurrence-tracker.js
    role: helper
    summary: Tracks recurring patterns in gate decision log.
  - path: blanking.js
    role: helper
    summary: Pure command blanking primitives (quote-state machine, strip family, heredoc/data/echo/cli-argv/inert-sink blankers) shared by gate-logic, the classifier, and the tracker — no gate state, no I/O. Mixed behavior — composes the pattern-config facade (patterns.json) with the pure transforms.
  - path: command-classification.js
    role: helper
    summary: Pure runtime-neutral command classifier — gate/recurrence/event modes over shell-parse + blanker primitives; dual-view inert-span provenance for unexpected-match events.
  - path: command-interpretation.js
    role: facade
    summary: Opaque request-local Command Interpretation interface — matches a command against a supplied Rule for policy-neutral provenance facts and requests recurrence projection without exposing parser or blanking views.
  - path: command-recurrence.js
    role: helper
    summary: Pure coarse recurrence projection owner; Command Interpretation exposes its opaque Rule-scoped key request while legacy tracker helpers forward here.
  - path: workflow-registry.js
    role: helper
    summary: Reads workflow manifest and provides lookup helpers.
  - path: bound-artifacts.js
    role: facade
    summary: FROZEN simple-glob rule constant extracted from evaluate-write-gate.js.
  - path: change-log-bound-paths.js
    role: facade
    summary: Rec 12 detection set (CHANGE_LOG_BOUND_PATHS) + canonicalizeChangeTarget — sibling of bound-artifacts.js for gap detection.
  - path: git-diff.js
    role: facade
    summary: readBranchTouchedPaths — read-only git-diff reader providing the touched-path set for the gap builder.
  - path: shell-parse.js
    role: primitive
    summary: Parse-only quote-aware tokenizer. Re-exports shell-quote parse + classifyPolicyTokens policy-view builder (no gate behavior).
